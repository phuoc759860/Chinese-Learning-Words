<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 中文练习</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 32px;
  max-width: 580px;
  width: 100%;
  box-shadow: 0 25px 80px rgba(0,0,0,0.35);
  text-align: center;
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp { from { opacity:0;transform:translateY(20px); } to { opacity:1;transform:translateY(0); } }
h1 { font-size: 1.15rem; color: #444; margin-bottom: 8px; letter-spacing: 2px; font-weight: 700; }
.screen { display: none; }
.screen.active { display: block; animation: fadeUp 0.35s ease; }

.lang-bar { display:flex;gap:0;margin-bottom:20px;border-radius:12px;overflow:hidden;background:#f0f0f5; }
.lang-btn { flex:1;padding:10px 6px;border:none;font-size:0.82rem;font-weight:600;cursor:pointer;background:transparent;color:#888;transition:all 0.2s;white-space:nowrap; }
.lang-btn.active { background: linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 15px rgba(102,126,234,0.4); }
.lang-btn:hover:not(.active) { color:#667eea; }

.loading { padding: 40px 0; }
.loading .spinner {
  width: 44px; height: 44px;
  border: 4px solid #e8e8f0;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.level-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0 20px; }
.level-btn {
  padding: 10px 20px;
  border: 2px solid #e4e4ef;
  border-radius: 12px;
  background: white;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  color: #888;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.level-btn:hover { border-color: #667eea; color: #667eea; transform: translateY(-1px); }
.level-btn.selected { background: linear-gradient(135deg,#667eea,#764ba2); color: white; border-color: transparent; box-shadow: 0 4px 15px rgba(102,126,234,0.35); }

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  color: #999;
  margin-bottom: 10px;
}
.status-bar .hsk-badge {
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: white;
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  box-shadow: 0 2px 10px rgba(102,126,234,0.3);
}
.score-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.88rem;
  color: #999;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid #eee;
}
.score-row span { font-weight: 700; color: #333; }
.word-card {
  background: linear-gradient(135deg,#f8f9ff,#f0f2ff);
  border-radius: 18px;
  padding: 36px 20px 28px;
  margin-bottom: 24px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 3px rgba(255,255,255,0.6), 0 4px 20px rgba(102,126,234,0.08);
}
.word-card .chinese { font-size: 3.5rem; font-weight: 700; color: #1a1a2e; letter-spacing: 4px; }
.word-card .progress { font-size: 0.78rem; color: #bbb; margin-top: 10px; }

.input-group { margin-bottom: 14px; text-align: left; }
.input-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #555; margin-bottom: 5px; letter-spacing: 0.3px; }
.input-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e4e4ef;
  border-radius: 12px;
  font-size: 1rem;
  transition: border-color 0.25s, box-shadow 0.25s;
  outline: none;
  background: #fafafe;
}
.input-group input:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.1); background: white; }
.input-group input.correct { border-color: #4caf50; background: #f0faf0; }
.input-group input.wrong { border-color: #f44336; background: #fff0f0; }

.btn-row { display: flex; gap: 12px; margin-top: 8px; }
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s, opacity 0.15s;
  letter-spacing: 0.3px;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
.btn-primary { background: linear-gradient(135deg,#667eea,#764ba2); color: white; box-shadow: 0 4px 15px rgba(102,126,234,0.35); }
.btn-primary:hover:not(:disabled) { box-shadow: 0 6px 25px rgba(102,126,234,0.45); transform: translateY(-1px); }
.btn-secondary { background: #eef0f7; color: #555; }
.btn-secondary:hover:not(:disabled) { background: #e2e4ef; }

.feedback {
  min-height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 0.92rem;
  font-weight: 600;
  transition: all 0.2s;
}
.feedback.show { background: #f5f5f5; color: #888; }
.feedback.correct { background: #e8f5e9; color: #2e7d32; }
.feedback.wrong { background: #fce4ec; color: #c62828; }

.skip-btn {
  background: none;
  border: none;
  color: #bbb;
  font-size: 0.82rem;
  cursor: pointer;
  margin-top: 10px;
  transition: color 0.15s;
}
.skip-btn:hover { color: #667eea; }

.user-bar { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:0.85rem;color:#999; }
.user-bar .name { font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
.history-btn { background:none;border:none;color:#999;cursor:pointer;font-size:0.82rem;padding:4px 10px;border-radius:8px;transition:all 0.15s; }
.history-btn:hover { background:#f0f0ff;color:#667eea; }

.history-table { width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:12px;border-radius:10px;overflow:hidden; }
.history-table th { background: linear-gradient(135deg,#667eea,#764ba2); color: white; padding: 9px 6px; font-weight: 700; font-size: 0.75rem; }
.history-table td { padding:8px 6px;border-bottom:1px solid #eee; }
.history-table tr:hover td { background:#f8f9ff; }

.record-label { font-size:0.72rem;color:#bbb;margin-top:4px;font-weight:500; }
.record-value { font-size:1rem;font-weight:700;color:#333; }

.reset-btn {
  background: none;
  border: 1px solid #e0e0ea;
  color: #999;
  padding: 6px 16px;
  border-radius: 10px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
}
.reset-btn:hover { background: #f0f0ff; border-color: #667eea; color: #667eea; }

#addWordForm { box-shadow: 0 4px 20px rgba(102,126,234,0.1); }
</style>
</head>
<body>
<div class="container">
  <div class="user-bar">
    <span>👤 <span class="name" id="userNameDisplay">User</span></span>
    <button class="history-btn" onclick="showHistory()">📊 Lịch sử</button>
  </div>
  <div class="lang-bar">
    <button class="lang-btn active" id="langCn" onclick="switchLang('cn')">🇨🇳 中文</button>
    <button class="lang-btn" id="langJp" onclick="switchLang('jp')">🇯🇵 日本語</button>
    <button class="lang-btn" id="langEn" onclick="switchLang('en')">🇬🇧 English</button>
    <button class="lang-btn" id="langFr" onclick="switchLang('fr')">🇫🇷 Français</button>
  </div>

  <!-- LOADING -->
  <div id="screenLoading" class="screen active">
    <div class="loading">
      <div class="spinner"></div>
      <p id="loadingMsg" style="color:#888;">Đang tải dữ liệu từ vựng...</p>
    </div>
  </div>

  <!-- LEVEL SELECTOR -->
  <div id="screenLevel" class="screen">
    <h1 id="levelTitle">HSK 中文练习</h1>
    <p style="color:#999;font-size:0.85rem;margin:8px 0;">Chọn cấp độ muốn học</p>
    <div class="level-grid" id="levelGrid"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="startBtn" onclick="startQuiz()" disabled>Bắt đầu</button>
    </div>
    <button class="skip-btn" id="addWordToggle" onclick="toggleAddWord()" style="margin-top:8px;">➕ Thêm từ mới</button>
    <div id="addWordForm" style="display:none;margin-top:12px;padding:16px;background:#f8f9ff;border-radius:12px;text-align:left;">
      <div class="input-group">
        <label for="addWordCh">Từ</label>
        <input type="text" id="addWordCh" placeholder="vd: 你好 / hello">
      </div>
      <div class="input-group" id="addReadingGroup">
        <label for="addWordPy">Phiên âm</label>
        <input type="text" id="addWordPy" placeholder="vd: nǐ hǎo / あう">
      </div>
      <div class="input-group">
        <label for="addWordVi">Nghĩa tiếng Việt</label>
        <input type="text" id="addWordVi" placeholder="vd: xin chào">
      </div>
      <div class="btn-row" style="margin-top:4px;">
        <button class="btn btn-primary" onclick="saveCustomWord()" style="font-size:0.9rem;padding:10px;">💾 Lưu</button>
        <button class="btn btn-secondary" onclick="toggleAddWord()" style="font-size:0.9rem;padding:10px;">Hủy</button>
      </div>
      <div id="customWordList" style="margin-top:12px;font-size:0.85rem;"></div>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;">
        <button onclick="exportCustomWords()" style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 12px;font-size:0.8rem;cursor:pointer;">📤 Xuất</button>
        <button onclick="document.getElementById('importFileInput').click()" style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 12px;font-size:0.8rem;cursor:pointer;">📥 Nhập</button>
        <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importCustomWords(event)">
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="screenHistory" class="screen">
    <h1>📊 Lịch sử & Xếp hạng</h1>
    <div style="display:flex;gap:16px;justify-content:center;margin:16px 0 20px;">
      <div><div class="record-label">Người dùng</div><div class="record-value" id="histUserName">—</div></div>
      <div><div class="record-label">Tổng lượt</div><div class="record-value" id="histTotalSessions">0</div></div>
      <div><div class="record-label">Điểm cao nhất</div><div class="record-value" id="histBestPct">0%</div></div>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:0.85rem;color:#888;">Lọc:</label>
      <select id="histLangFilter" onchange="showHistory()" style="padding:4px 8px;border:1px solid #ddd;border-radius:6px;font-size:0.85rem;">
        <option value="all">Tất cả</option>
        <option value="cn">🇨🇳 Chinese</option>
        <option value="jp">🇯🇵 Japanese</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 French</option>
      </select>
    </div>
    <div id="histList"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-secondary" onclick="backToLevelFromHist()">← Quay lại</button>
      <button class="btn btn-secondary" onclick="clearHistory()" style="color:#c62828;">🗑 Xóa lịch sử</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screenQuiz" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <button class="reset-btn" onclick="backToLevel()">← Chọn lại cấp độ</button>
      <button class="reset-btn" onclick="resetStats()">Làm lại</button>
    </div>
    <div class="status-bar">
      <span class="hsk-badge" id="hskBadge">HSK3</span>
      <span id="reviewBadge" style="display:none;background:#ff9800;color:white;padding:3px 12px;border-radius:20px;font-size:0.75rem;font-weight:600;">🔄 Ôn tập</span>
      <span id="wordsTotal">0 từ</span>
    </div>
    <div class="score-row">
      <div>✅ <span id="correctCount">0</span></div>
      <div>❌ <span id="wrongCount">0</span></div>
      <div>📊 <span id="streak">0</span> liên tiếp</div>
    </div>
    <div class="word-card">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="chinese" id="chineseWord">—</div>
        <button id="speakBtn" onclick="speakCurrent()" style="background:none;border:none;font-size:1.8rem;cursor:pointer;padding:4px;opacity:0.6;transition:opacity 0.15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6" title="Đọc to">🔊</button>
      </div>
      <div class="progress" id="progressText">1 / 100</div>
    </div>
    <div class="input-group" id="readingGroup">
      <label for="pinyinInput" id="readingLabel">Pinyin (phiên âm)</label>
      <input type="text" id="pinyinInput" placeholder="vd: nǐ hǎo" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="translationInput">Nghĩa tiếng Việt</label>
      <input type="text" id="translationInput" placeholder="vd: chào" autocomplete="off">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn" onclick="checkAnswer()">Kiểm tra</button>
      <button class="btn btn-secondary" id="nextBtn" onclick="nextWord()" disabled>Tiếp</button>
    </div>
    <button class="skip-btn" onclick="skipWord()">Bỏ qua →</button>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

let currentLang = 'cn';
let allWords = [];
let allWordsXlsx = [];
let filteredWords = [];

let correctCount = 0;
let wrongCount = 0;
let streak = 0;
let answered = false;

let wrongWords = [];

let maxStreak = 0;

const LANG_NAMES = { cn:'Chinese', jp:'Japanese', en:'English' };
const LANG_FLAGS = { cn:'🇨🇳', jp:'🇯🇵', en:'🇬🇧' };

function getUserName() {
  let name = localStorage.getItem('userName');
  if (!name) {
    name = prompt('Nhập tên của bạn:', '') || 'User';
    if (name.trim()) localStorage.setItem('userName', name.trim());
  }
  return name;
}

function saveSession(lang, level, correct, wrong, total) {
  const history = JSON.parse(localStorage.getItem('quizHistory') || '[]');
  history.unshift({
    date: new Date().toISOString(),
    lang, level, correct, wrong, total,
    pct: total > 0 ? Math.round(correct / total * 100) : 0
  });
  if (history.length > 200) history.length = 200;
  localStorage.setItem('quizHistory', JSON.stringify(history));
  localStorage.setItem('maxStreak_' + lang, Math.max(maxStreak, parseInt(localStorage.getItem('maxStreak_' + lang) || '0')));
}

function showHistory() {
  const history = JSON.parse(localStorage.getItem('quizHistory') || '[]');
  const filter = document.getElementById('histLangFilter').value;
  const filtered = filter === 'all' ? history : history.filter(h => h.lang === filter);
  const name = getUserName();
  document.getElementById('histUserName').textContent = name;
  document.getElementById('histTotalSessions').textContent = filtered.length;
  const best = filtered.reduce((m, h) => h.pct > m ? h.pct : m, 0);
  document.getElementById('histBestPct').textContent = best + '%';

  const list = document.getElementById('histList');
  if (filtered.length === 0) {
    list.innerHTML = '<p style="color:#aaa;padding:20px;">Chưa có lịch sử</p>';
  } else {
    let html = '<table class="history-table"><tr><th>Ngày</th><th>Ngôn ngữ</th><th>Cấp độ</th><th>Điểm</th><th>%</th></tr>';
    for (const h of filtered) {
      const d = new Date(h.date);
      const ds = d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'});
      html += `<tr><td>${ds}</td><td>${LANG_FLAGS[h.lang] || ''} ${h.lang.toUpperCase()}</td><td>${h.level}</td><td>${h.correct}/${h.total}</td><td><strong>${h.pct}%</strong></td></tr>`;
    }
    html += '</table>';
    list.innerHTML = html;
  }

  document.getElementById('screenQuiz').classList.remove('active');
  document.getElementById('screenLevel').classList.remove('active');
  document.getElementById('screenHistory').classList.add('active');
}

function clearHistory() {
  if (confirm('Xóa toàn bộ lịch sử?')) {
    localStorage.setItem('quizHistory', '[]');
    showHistory();
  }
}

function backToLevelFromHist() {
  document.getElementById('screenHistory').classList.remove('active');
  document.getElementById('screenLevel').classList.add('active');
}

function getCustomWords(lang) {
  return JSON.parse(localStorage.getItem('customWords_' + lang) || '[]');
}

function mergeCustomWords(base) {
  const custom = getCustomWords(currentLang);
  return custom.length ? [...base, ...custom] : base;
}

function toggleAddWord() {
  const form = document.getElementById('addWordForm');
  form.style.display = form.style.display === 'none' ? '' : 'none';
  if (form.style.display !== 'none') {
  document.getElementById('addReadingGroup').style.display = (currentLang === 'en' || currentLang === 'fr') ? 'none' : '';
    document.getElementById('addWordCh').focus();
    showCustomWordList();
  }
}

function showCustomWordList() {
  const words = getCustomWords(currentLang);
  const el = document.getElementById('customWordList');
  if (!words.length) { el.innerHTML = '<span style="color:#aaa;">Chưa có từ nào</span>'; return; }
  let html = `<strong>Từ của tôi (${words.length}):</strong><br>`;
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #eee;">
      <span><b>${w.ch}</b>${w.py ? ' (' + w.py + ')' : ''} — ${w.vi}</span>
      <button onclick="deleteCustomWord(${i})" style="background:none;border:none;color:#c62828;cursor:pointer;font-size:0.8rem;">✕</button>
    </div>`;
  }
  el.innerHTML = html;
}

function saveCustomWord() {
  const ch = document.getElementById('addWordCh').value.trim();
  const py = document.getElementById('addWordPy').value.trim();
  const vi = document.getElementById('addWordVi').value.trim();
  if (!ch || !vi) { alert('Vui lòng nhập từ và nghĩa'); return; }
  const words = getCustomWords(currentLang);
  if (words.some(w => w.ch === ch)) { alert('Từ này đã có trong danh sách'); return; }
  words.push({ ch, py, vi, level: 'Từ của tôi' });
  localStorage.setItem('customWords_' + currentLang, JSON.stringify(words));
  document.getElementById('addWordCh').value = '';
  document.getElementById('addWordPy').value = '';
  document.getElementById('addWordVi').value = '';
  showCustomWordList();
  refreshLevelScreen();
}

function deleteCustomWord(idx) {
  const words = getCustomWords(currentLang);
  words.splice(idx, 1);
  localStorage.setItem('customWords_' + currentLang, JSON.stringify(words));
  showCustomWordList();
  refreshLevelScreen();
}

function exportCustomWords() {
  const words = getCustomWords(currentLang);
  if (!words.length) { alert('Không có từ nào để xuất'); return; }
  const blob = new Blob([JSON.stringify(words, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'words_' + currentLang + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importCustomWords(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported) || !imported.length) { alert('File không hợp lệ'); return; }
      const existing = getCustomWords(currentLang);
      let added = 0;
      for (const w of imported) {
        if (w.ch && w.vi && !existing.some(x => x.ch === w.ch)) {
          existing.push({ ch: w.ch, py: w.py || '', vi: w.vi, level: 'Từ của tôi' });
          added++;
        }
      }
      localStorage.setItem('customWords_' + currentLang, JSON.stringify(existing));
      showCustomWordList();
      refreshLevelScreen();
      alert('Đã nhập ' + added + ' từ mới' + (imported.length - added > 0 ? ' (' + (imported.length - added) + ' từ trùng bỏ qua)' : ''));
    } catch (err) {
      alert('Lỗi đọc file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function refreshLevelScreen() {
  if (currentLang === 'cn') {
    if (typeof allWordsXlsx !== 'undefined' && allWordsXlsx.length) {
      allWords = mergeCustomWords(allWordsXlsx);
      showLevelScreen();
    } else {
      loadXlsx();
    }
  } else if (currentLang === 'jp') {
    allWords = mergeCustomWords(allJp);
    showLevelScreen();
  } else if (currentLang === 'en') {
    allWords = mergeCustomWords(allEn);
    showLevelScreen();
  } else if (currentLang === 'fr') {
    allWords = mergeCustomWords(allFr);
    showLevelScreen();
  }
}

  document.getElementById('langJp').className = 'lang-btn' + (lang === 'jp' ? ' active' : '');

    document.getElementById('screenLoading').classList.add('active');
    document.getElementById('loadingMsg').textContent = 'Đang tải dữ liệu từ vựng...';
    loadXlsx();

async function loadXlsx() {
  try {
    const resp = await fetch(XLSX_FILE);
    if (!resp.ok) throw new Error('Không thể tải file');
    const buf = await resp.arrayBuffer();
    const data = new Uint8Array(buf);
    const wb = XLSX.read(data, { type: 'array' });
    parseWorkbook(wb);
  } catch (err) {
    document.getElementById('screenLoading').innerHTML =
      `<p style="color:#c62828;">✗ Lỗi: ${err.message}</p>
       <p style="color:#999;font-size:0.85rem;margin-top:8px;">Đảm bảo file <strong>${XLSX_FILE}</strong> nằm cùng thư mục với index.html</p>`;
  }
}

function parseWorkbook(wb) {
  allWordsXlsx = [];
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    const level = sheetName.replace(/[^0-9]/g, '') || '?';
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || !row[1]) continue;
      const ch = String(row[1]).trim();
      const py = String(row[2] || '').trim();
      const vi = String(row[3] || '').trim();
      if (ch && py && vi) {
        allWordsXlsx.push({ ch, py, vi, level: 'HSK' + level });
      }
    }
  }
  if (allWordsXlsx.length === 0) {
    document.getElementById('screenLoading').innerHTML = '<p style="color:#c62828;">✗ Không tìm thấy từ vựng nào trong file</p>';
    return;
  }
  allWords = mergeCustomWords(allWordsXlsx);
  showLevelScreen();
}

function showLevelScreen() {
  document.getElementById('screenLoading').classList.remove('active');
  document.getElementById('screenLevel').classList.add('active');

  const titles = { cn:'HSK 中文练习', jp:'JLPT 日本語練習', en:'English Practice', fr:'Français A1-B1' };
  document.getElementById('levelTitle').textContent = titles[currentLang] || 'Practice';
  document.getElementById('startBtn').textContent = 'Bắt đầu';
  document.getElementById('addReadingGroup').style.display = (currentLang === 'en' || currentLang === 'fr') ? 'none' : '';

  const levels = {};
  for (const w of allWords) levels[w.level] = (levels[w.level] || 0) + 1;
  selectedLevels = {};
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (const lv of Object.keys(levels).sort()) {
    const btn = document.createElement('button');
    btn.className = 'level-btn selected';
    btn.textContent = `${lv} (${levels[lv]} từ)`;
    btn.dataset.level = lv;
    selectedLevels[lv] = true;
    btn.addEventListener('click', () => {
      selectedLevels[lv] = !selectedLevels[lv];
      btn.classList.toggle('selected');
      document.getElementById('startBtn').disabled = !Object.values(selectedLevels).some(Boolean);
    });
    grid.appendChild(btn);
  }
  document.getElementById('startBtn').disabled = false;
}

  document.getElementById('screenLevel').classList.remove('active');

function stripTones(py) {
  const m = {'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'u','ǘ':'u','ǚ':'u','ǜ':'u'};
  return py.toLowerCase().split('').map(c => m[c] || c).join('');
}

function normalize(str) {
  return str.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[，。！？、；：""''【】《》\-–—·]/g, '');
}

function checkPinyin(input, correct) {
  return normalize(input) === normalize(correct);
}

function checkTranslation(input, correct) {
  return correct.split(/[,;，；/]/).map(s => normalize(s)).includes(normalize(input));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

function initOrder() { order = shuffle([...Array(filteredWords.length).keys()]); currentIndex = 0; }
function updateScore() {
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('streak').textContent = streak;
}

function showWord() {
  const word = filteredWords[order[currentIndex]];
  document.getElementById('chineseWord').textContent = word.ch;
  document.getElementById('hskBadge').textContent = word.level;
  document.getElementById('progressText').textContent = `${currentIndex + 1} / ${filteredWords.length}`;
  document.getElementById('pinyinInput').value = '';
  document.getElementById('translationInput').value = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('pinyinInput').className = '';
  document.getElementById('translationInput').className = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('nextBtn').disabled = true;
  answered = false;
  const focusEl = (currentLang === 'en' || currentLang === 'fr') ? document.getElementById('translationInput') : document.getElementById('pinyinInput');
  focusEl.focus();
}

function checkAnswer() {
  if (answered) return;
  const word = filteredWords[order[currentIndex]];
  const isEn = currentLang === 'en';
  const isFr = currentLang === 'fr';
  const hideReading = isEn || isFr;
  const pi = hideReading ? '' : document.getElementById('pinyinInput').value;
  const ti = document.getElementById('translationInput').value;
  if ((!hideReading && !pi.trim()) || !ti.trim()) {
    document.getElementById('feedback').className = 'feedback show';
    document.getElementById('feedback').innerHTML = hideReading ? 'Vui lòng nhập nghĩa tiếng Việt' : 'Vui lòng điền cả hai ô';
    return;
  }
  const isJp = currentLang === 'jp';
  const pyOk = hideReading || checkPinyin(pi, word.py);
  const viOk = checkTranslation(ti, word.vi);
  const pe = document.getElementById('pinyinInput');
  const te = document.getElementById('translationInput');
  const fb = document.getElementById('feedback');
  answered = true;
  if (pyOk && viOk) {
    if (!hideReading) pe.className = 'correct';
    te.className = 'correct';
    fb.className = 'feedback correct'; fb.innerHTML = '✓ Chính xác!';
    correctCount++; streak++;
    if (streak > maxStreak) maxStreak = streak;
  } else {
    if (!hideReading) pe.className = pyOk ? 'correct' : 'wrong';
    te.className = viOk ? 'correct' : 'wrong';
    fb.className = 'feedback wrong';
    const parts = [];
    if (!hideReading && !pyOk) parts.push(`${isJp ? 'Hiragana' : 'Pinyin'}: ${word.py}`);
    if (!viOk) parts.push(`Nghĩa: ${word.vi}`);
    fb.innerHTML = `✗ ${parts.join(' | ')}`;
    wrongCount++; streak = 0;
    if (!wrongWords.some(w => w.ch === word.ch)) wrongWords.push(word);
  }
  updateScore();
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
}

function finishQuiz() {
  const total = correctCount + wrongCount;
  const pct = total > 0 ? Math.round(correctCount / total * 100) : 0;
  const level = filteredWords.length > 0 ? filteredWords[0].level : '?';
  saveSession(currentLang, level, correctCount, wrongCount, total);
}

function nextWord() {
  currentIndex++;
  if (currentIndex >= filteredWords.length) {
    const total = correctCount + wrongCount;
    const fb = document.getElementById('feedback');
    if (wrongWords.length > 0) {
      finishQuiz();
      fb.className = 'feedback show';
      fb.innerHTML = `🎉 Xong! Đúng ${correctCount}/${total}. Còn <strong>${wrongWords.length}</strong> từ sai cần ôn tập.`;
      document.getElementById('chineseWord').textContent = '✓';
      document.getElementById('nextBtn').textContent = `📖 Ôn ${wrongWords.length} từ sai`;
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('nextBtn').onclick = startReview;
      document.getElementById('speakBtn').style.display = 'none';
    } else {
      finishQuiz();
      fb.className = 'feedback show';
      fb.innerHTML = `🎉 Hoàn thành! Đúng ${correctCount}/${total} (${pct}%) ${reviewRound ? '- Tất cả đã đúng!' : ''}`;
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('chineseWord').textContent = '🎉';
    }
    return;
  }
  showWord();
}

function startReview() {
  document.getElementById('nextBtn').textContent = 'Tiếp';
  document.getElementById('nextBtn').onclick = nextWord;
  document.getElementById('speakBtn').style.display = '';
  document.getElementById('reviewBadge').style.display = '';
  filteredWords = [...wrongWords];
  wrongWords = [];
  reviewRound = true;
  document.getElementById('wordsTotal').textContent = filteredWords.length + ' từ (ôn tập)';
  correctCount = 0; wrongCount = 0; streak = 0;
  updateScore();
  initOrder();
  showWord();
}

function skipWord() {
  if (answered) return;
  wrongCount++; streak = 0;
  updateScore();
  const word = filteredWords[order[currentIndex]];
  const isEn = currentLang === 'en';
  const isFr = currentLang === 'fr';
  const hideReading = isEn || isFr;
  const fb = document.getElementById('feedback');
  fb.className = 'feedback wrong';
  fb.innerHTML = `Đã bỏ qua: ${hideReading ? word.ch + ' — ' + word.vi : word.py + ' — ' + word.vi}`;
  if (!hideReading) {
    document.getElementById('pinyinInput').value = word.py;
    document.getElementById('pinyinInput').className = 'wrong';
  }
  document.getElementById('translationInput').value = word.vi;
  document.getElementById('translationInput').className = 'wrong';
  if (!wrongWords.some(w => w.ch === word.ch)) wrongWords.push(word);
  answered = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
}

function speakCurrent() {
  const text = document.getElementById('chineseWord').textContent;
  if (!text || text === '✓' || text === '🎉') return;

  const enVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  const jpVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('ja'));
  const zhVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('zh'));
  const frVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
  const voiceMap = { jp: jpVoice, en: enVoice, fr: frVoice };
  const targetVoice = voiceMap[currentLang] || zhVoice;

  if (targetVoice) {
    window.speechSynthesis.cancel();
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = targetVoice;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
    return;
  }

  const word = filteredWords[order[currentIndex]];
  const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=1');
  a.volume = 1;
  a.play().catch(() => {
    a.remove();
    if (word && currentLang === 'cn' && word.py) {
      const u = new SpeechSynthesisUtterance(word.py);
      u.lang = 'en-US';
      u.rate = 0.7;
      window.speechSynthesis.speak(u);
    }
  });
}

function resetStats() {
  correctCount = 0; wrongCount = 0; streak = 0;
  if (reviewRound) {
    filteredWords = [...wrongWords];
    wrongWords = [];
  }
  updateScore(); initOrder(); showWord();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!answered && document.getElementById('screenQuiz').classList.contains('active')) checkAnswer();
    else if (answered) nextWord();
  }
});

if ('speechSynthesis' in window) {
  const checkVoices = () => {
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) {
      speechSynthesis.cancel();
      speechSynthesis.resume();
    }
  };
  checkVoices();
  speechSynthesis.onvoiceschanged = checkVoices;
}

getUserName();
document.getElementById('userNameDisplay').textContent = getUserName();
loadXlsx();
</script>
